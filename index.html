<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      (() => {
        const param = new URLSearchParams(window.location.search).get("scoutTheme");
        const theme = param === "light" || param === "dark"
          ? param
          : (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
        document.documentElement.setAttribute("data-theme", theme);
        let accent = "red";
        try {
          const saved = window.localStorage.getItem("devprep.accent.v1");
          if (saved !== null) {
            if (["red", "blue", "forest", "purple"].includes(saved)) accent = saved;
            else document.documentElement.dataset.accentError = "invalid";
          }
        } catch {
          document.documentElement.dataset.accentError = "unavailable";
        }
        document.documentElement.dataset.accent = accent;
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f7f4ef" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <meta name="description" content="A little practice. A stronger interview. Build lasting skills with guided lessons, deliberate practice, and spaced reviews." />
    <title>DevPREP — A little better, every day</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
